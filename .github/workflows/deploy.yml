name: Deploy react
on:
  push:
   branches:
    - master

jobs:
 build:
   runs-on: ubuntu-latest
   steps:
    - uses: actions/checkout@v2
    - run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}} 
    - run: docker build -t karim/react -f Dockerfile.dev .
    - run: docker run -e CI=true karim/react npm run test
    - name: Generate deployment package
      run: zip -r deploy.zip . -x '*.git*'

    - run: docker build -t karimmo24/multi-server ./microservices/server
    - run: docker build -t karimmo24/multi-client ./microservices/client
    - run: docker build -t karimmo24/multi-worker ./microservices/worker
    - run: docker build -t karimmo24/multi-nginx ./microservices/nginx
    
    - run: docker push karimmo24/multi-server
    - run: docker push karimmo24/multi-client
    - run: docker push karimmo24/multi-worker
    - run: docker push karimmo24/multi-nginx
    
